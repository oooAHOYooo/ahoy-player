[package]
name = "ahoy-player"
version = "0.2.0"
edition = "2021"
description = "Ahoy Player native desktop application"
license = "MIT"

[package.metadata.deb]
maintainer = "Ahoy Player contributors"
copyright = "2026, Ahoy Player contributors"
section = "sound"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/ahoy-player", "usr/bin/", "755"],
    ["packaging/linux/ahoy-player.desktop", "usr/share/applications/", "644"],
]

[dependencies]
anyhow = "1"
dirs = "6"
lofty = "0.22"
rfd = "0.15"
rodio = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = "1.8"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
slint-build = "1.8"
