[package]
name = "ahoy-player"
version = "0.2.0"
edition = "2021"
description = "Ahoy Player native desktop application"
license = "MIT"

[package.metadata.deb]
maintainer = "Ahoy Player contributors"
copyright = "2026, Ahoy Player contributors"
section = "sound"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/ahoy-player", "usr/bin/", "755"],
    ["packaging/linux/ahoy", "usr/bin/", "755"],
    ["apps/terminal/ahoy.mjs", "usr/lib/ahoy-player-terminal/", "644"],
    ["apps/terminal/terminal-art.mjs", "usr/lib/ahoy-player-terminal/", "644"],
    ["apps/terminal/artwork-worker.mjs", "usr/lib/ahoy-player-terminal/", "644"],
    ["apps/terminal/audio-mixer.mjs", "usr/lib/ahoy-player-terminal/", "644"],
    ["apps/terminal/assets/ahoy-demo.mp3", "usr/lib/ahoy-player-terminal/assets/", "644"],
    ["packaging/linux/ahoy-player.desktop", "usr/share/applications/", "644"],
]

[dependencies]
anyhow = "1"
dirs = "6"
lofty = "0.22"
rfd = "0.15"
rodio = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = "1.8"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
slint-build = "1.8"
